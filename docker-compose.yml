# MCDP Marketing Hub — Postiz (social scheduling) behind a Cloudflare Tunnel.
# Based on gitroomhq/postiz-app docker-compose.yaml (AGPL-3.0), trimmed for a
# small private server: no debug/monitoring containers, nothing exposed to the
# internet except through the tunnel, and every database on a named volume.
#
# All settings live in .env (created by install.sh). Do not edit secrets here.

name: mcdp-marketing-hub

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:${POSTIZ_VERSION:-latest}
    container_name: postiz
    restart: unless-stopped
    env_file: .env
    environment:
      MAIN_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      DATABASE_URL: postgresql://postiz:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: "false"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      # Server-only by default; install.sh opens it to the home network
      # (LOCAL_BIND=0.0.0.0) until the Cloudflare tunnel is in place.
      - "${LOCAL_BIND:-127.0.0.1}:${LOCAL_PORT:-4007}:5000"
    networks: [postiz-network, temporal-network]
    depends_on:
      postiz-postgres: { condition: service_healthy }
      postiz-redis: { condition: service_healthy }
      temporal: { condition: service_started }

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postiz
    volumes:
      - postiz-postgres:/var/lib/postgresql/data
    networks: [postiz-network]
    healthcheck:
      test: pg_isready -U postiz -d postiz
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: unless-stopped
    volumes:
      - postiz-redis:/data
    networks: [postiz-network]
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Daily backups of the database + media into ./backups (keeps 14) ----
  backup:
    image: postgres:17-alpine
    container_name: postiz-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP: "14"
    volumes:
      - ./backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
      - postiz-uploads:/uploads:ro
      - ads-data:/ads-data:ro
    networks: [postiz-network]
    depends_on:
      postiz-postgres: { condition: service_healthy }

  # ---- Temporal (Postiz's job scheduler) ----
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    volumes:
      - temporal-elasticsearch:/usr/share/elasticsearch/data
    networks: [temporal-network]

  temporal-postgresql:
    image: postgres:16-alpine
    container_name: temporal-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    networks: [temporal-network]

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: unless-stopped
    depends_on: [temporal-postgresql, temporal-elasticsearch]
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks: [temporal-network]

  # ---- AI translator: Postiz's "OpenAI" calls -> any provider (enable-ai.sh) ----
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-main-stable}
    container_name: postiz-ai
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      AI_PROVIDER_KEY: ${AI_PROVIDER_KEY:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-gemini/gemini-2.5-flash}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-gemini/gemini-2.5-flash-image}
      AI_IMAGE_KEY: ${AI_IMAGE_KEY:-${AI_PROVIDER_KEY:-}}
      AI_IMAGE_API_BASE: ${AI_IMAGE_API_BASE:-}
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    networks: [postiz-network]
    profiles: [ai]

  # ---- Free AI images via Cloudflare Workers AI (enable-cf-images.sh) ----
  cf-image:
    image: python:3.12-alpine
    container_name: postiz-cf-image
    restart: unless-stopped
    command: ["python", "/app/cf-image.py"]
    environment:
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_IMAGE_MODEL: ${CF_IMAGE_MODEL:-@cf/black-forest-labs/flux-1-schnell}
      CF_IMAGE_STEPS: ${CF_IMAGE_STEPS:-4}
    volumes:
      - ./cf-image.py:/app/cf-image.py:ro
    networks: [postiz-network]
    profiles: [cfimages]

  # ---- Ads page: per-practice Google/Meta export analysis (enable-ads.sh) ----
  ads:
    build: ./ads
    image: mcdp-ads:local
    pull_policy: build
    container_name: postiz-ads
    restart: unless-stopped
    environment:
      ADS_PASSWORD: ${ADS_PASSWORD:-}
      ADS_SECRET: ${ADS_SECRET:-}
      AI_BASE_URL: http://litellm:4000/v1
      AI_API_KEY: ${LITELLM_MASTER_KEY:-}
      AI_MODEL: gpt-4.1
      ADS_PUBLIC_URL: ${ADS_PUBLIC_URL:-}
      # Phase 2: automatic nightly pulls (set by connect-ads.sh)
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
    volumes:
      - ads-data:/data
    ports:
      # Server-only by default; the public reaches it through the Cloudflare tunnel.
      - "${LOCAL_BIND:-127.0.0.1}:${ADS_PORT:-4010}:8000"
    networks: [postiz-network]
    profiles: [ads]

  # ---- Cloudflare Tunnel: public HTTPS URL with no open ports on the server ----
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: postiz-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [postiz-network]
    depends_on: [postiz]
    profiles: [tunnel]

volumes:
  postiz-config:
  postiz-uploads:
  postiz-postgres:
  postiz-redis:
  temporal-postgres:
  temporal-elasticsearch:
  ads-data:

networks:
  postiz-network:
  temporal-network:
    name: temporal-network
