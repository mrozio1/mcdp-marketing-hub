# social-skin: sits between the Cloudflare tunnel and Social (the scheduling app) and adds the
# MCDP Hub look to its pages. Everything else passes straight through, unchanged.
# Tunnel route for social.mcdp.com: http://social-skin:8080   (back to http://postiz:5000 to undo)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 0;          # media uploads of any size, as before
    proxy_request_buffering off;     # stream uploads straight through
    proxy_buffering off;             # stream responses (e.g. the AI assistant) straight through
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # the skin's own files
    location ^~ /__mcdp/ {
        alias /skin/;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /__mcdp-health { access_log off; return 200 "ok\n"; }

    location / {
        proxy_pass http://postiz:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # pages must arrive uncompressed so the two lines below can be added to them
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/__mcdp/skin.css?v=1"><script src="/__mcdp/skin.js?v=1" defer></script></head>';
    }
}
