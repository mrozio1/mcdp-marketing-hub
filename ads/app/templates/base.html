<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ads{% endblock %} · MCDP Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block chrome %}
<header class="topbar">
  <a class="brand" href="/">MCDP Ads</a>
  <nav>
    <a href="/">Practices</a>
    <a href="/connections">Connections</a>
    <form method="post" action="/logout"><button class="linklike" type="submit">Sign out</button></form>
  </nav>
</header>
{% endblock %}
<main class="{% block mainclass %}wrap{% endblock %}">
  {% if flash %}<p class="flash flash-{{ flash.kind }}" role="status">{{ flash.msg }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
<script>
  // Disable buttons on submit so slow AI requests aren't sent twice, and say what's happening.
  document.querySelectorAll('form[data-busy]').forEach(f => f.addEventListener('submit', e => {
    const b = e.submitter || f.querySelector('button[type=submit]');
    if (b) { b.disabled = true; b.textContent = b.dataset.busy || f.dataset.busy; }
  }));
  // Fixes list: "select all" per group, and keep the Apply button's count current.
  const fixForm = document.querySelector('form.fix-list');
  if (fixForm) {
    const boxes = () => [...fixForm.querySelectorAll('input[name=ids]')];
    const btn = fixForm.querySelector('.apply-btn');
    const sync = () => {
      const n = boxes().filter(b => b.checked).length;
      btn.disabled = n === 0;
      btn.textContent = n ? `Apply ${n} change${n === 1 ? '' : 's'}` : 'Tick the changes to apply';
      fixForm.querySelectorAll('input[data-all]').forEach(a => {
        const g = boxes().filter(b => b.dataset.group === a.dataset.all);
        a.checked = g.length > 0 && g.every(b => b.checked);
      });
    };
    fixForm.addEventListener('change', e => {
      if (e.target.dataset.all) boxes().filter(b => b.dataset.group === e.target.dataset.all)
        .forEach(b => { b.checked = e.target.checked; });
      sync();
    });
    sync();
  }
  document.querySelectorAll('form[data-confirm]').forEach(f => f.addEventListener('submit', e => {
    if (!window.confirm(f.dataset.confirm)) e.preventDefault();
  }));
</script>
</body>
</html>
