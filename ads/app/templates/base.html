<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ads{% endblock %} · MCDP Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block chrome %}
<header class="topbar">
  <a class="brand" href="/">MCDP Ads</a>
  <nav>
    <a href="/">Practices</a>
    <form method="post" action="/logout"><button class="linklike" type="submit">Sign out</button></form>
  </nav>
</header>
{% endblock %}
<main class="{% block mainclass %}wrap{% endblock %}">
  {% if flash %}<p class="flash flash-{{ flash.kind }}" role="status">{{ flash.msg }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
<script>
  // Disable buttons on submit so slow AI requests aren't sent twice, and say what's happening.
  document.querySelectorAll('form[data-busy]').forEach(f => f.addEventListener('submit', () => {
    const b = f.querySelector('button[type=submit]');
    if (b) { b.disabled = true; b.textContent = f.dataset.busy; }
  }));
  document.querySelectorAll('form[data-confirm]').forEach(f => f.addEventListener('submit', e => {
    if (!window.confirm(f.dataset.confirm)) e.preventDefault();
  }));
</script>
</body>
</html>
